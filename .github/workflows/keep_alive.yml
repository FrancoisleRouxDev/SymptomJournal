name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes — keeps Render free-tier from spinning down
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping root endpoint
        run: |
          # Use root / endpoint (always available in production).
          # /ping will also work once development is merged into main.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://symptomjournal.onrender.com/)
          echo "Response status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: backend returned status $STATUS"
            exit 1
          fi
          echo "Backend is alive ✅"
